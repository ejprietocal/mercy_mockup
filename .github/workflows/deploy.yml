name: Deploy a producción (Easypanel · puerto 4000)

# Se ejecuta en cada push a main (y se puede lanzar a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Evita despliegues simultáneos: el más reciente espera al anterior.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}   # se normaliza a minúsculas en el job

jobs:
  build:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas
        id: meta
        run: echo "image=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # QEMU + Buildx permiten publicar una imagen para amd64 Y arm64
      # (el servidor es ARM64; sin esto falla con "no matching manifest for linux/arm64/v8").
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Redesplegar en Easypanel
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Easypanel descarga la imagen :latest que acaba de publicar el job anterior.
      - name: Disparar redeploy
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: curl -fsS -X POST "$EASYPANEL_DEPLOY_URL"
