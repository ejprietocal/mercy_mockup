<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f3ef">
  <title>Panel Mercy Studio</title>
  <link rel="icon" href="../assets/logo/mercy-studio-terracota.png" type="image/png">
  <!-- Tipografías de la tienda para las vistas previas (Kaushan Script = cursiva de marca, Lekton = textos pequeños);
       la CSP del panel permite fonts.googleapis.com / fonts.gstatic.com -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Lekton:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/views/contenido.css">
  <link rel="stylesheet" href="css/views/productos.css">
  <link rel="stylesheet" href="css/views/catalogo.css">
  <link rel="stylesheet" href="css/views/marketing.css">
  <link rel="stylesheet" href="css/views/sistema.css">
  <link rel="modulepreload" href="js/core/dom.js">
  <link rel="modulepreload" href="js/core/api.js">
  <link rel="modulepreload" href="js/core/ui.js">
  <link rel="modulepreload" href="js/core/forms.js">
  <link rel="modulepreload" href="js/core/media.js">
  <link rel="modulepreload" href="js/core/router.js">
  <script type="module" src="js/main.js"></script>
</head>
<body class="admin is-booting">
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <!-- Mientras se verifica la sesión -->
  <div class="boot" id="boot" role="status">
    <img class="boot__logo" src="../assets/logo/mercy-studio-terracota.png" alt="Mercy Studio" width="180" height="89">
    <span class="spinner spinner--lg" aria-hidden="true"></span>
    <p class="boot__text">Cargando el panel…</p>
  </div>

  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Menú principal">
      <div class="sidebar__brand">
        <a class="sidebar__logo" href="#/" aria-label="Mercy Studio · Escritorio">
          <img src="../assets/logo/mercy-studio-terracota.png" alt="" width="112" height="56">
        </a>
        <span class="sidebar__tag">Panel</span>
        <button class="sidebar__close icon-only" id="sidebar-close" type="button" aria-label="Cerrar menú">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Secciones del panel"></nav>
      <div class="sidebar__foot">
        <p class="sidebar__version" id="app-version"></p>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>

    <div class="main-col">
      <header class="topbar">
        <button class="topbar__menu icon-only" id="menu-toggle" type="button" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
        </button>
        <p class="topbar__title"><span class="topbar__group" id="topbar-group"></span><span class="topbar__page" id="topbar-title"></span></p>
        <div class="topbar__actions">
          <a class="btn btn--secondary btn--sm topbar__site" href="../" target="_blank" rel="noopener" aria-label="Ver tienda (se abre en una pestaña nueva)">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            <span class="btn__label">Ver tienda</span><span class="sr-only"> (se abre en una pestaña nueva)</span>
          </a>
          <div class="topbar__user" id="user-menu"></div>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-relevant="additions"></div>
  <noscript><p class="noscript">El panel necesita JavaScript activado.</p></noscript>
</body>
</html>
