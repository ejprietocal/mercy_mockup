<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f6f3ef">
  <title>Ingresar · Panel Mercy Studio</title>
  <link rel="icon" href="../assets/logo/mercy-studio-terracota.png" type="image/png">
  <link rel="stylesheet" href="css/admin.css">
  <script type="module" src="js/login.js"></script>
</head>
<body class="admin login-page">
  <main class="login" id="main">
    <div class="login__card">
      <a class="login__logo" href="../" aria-label="Mercy Studio · ir a la tienda">
        <img src="../assets/logo/mercy-studio-terracota.png" alt="Mercy Studio" width="200" height="99">
      </a>
      <h1 class="login__title">Panel administrador</h1>
      <p class="login__subtitle">Ingresa para editar el contenido, los productos y los cupones de la tienda.</p>

      <div class="notice notice--info login__notice" id="login-notice" role="status" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="notice__icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        <div class="notice__body"><p class="notice__msg" id="login-notice-text"></p></div>
      </div>

      <div class="notice notice--danger login__notice" id="login-error" role="alert" hidden>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="notice__icon" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
        <div class="notice__body"><p class="notice__msg" id="login-error-text"></p></div>
      </div>

      <form class="login__form" id="login-form" novalidate>
        <div class="field">
          <label class="field__label" for="login-email">Correo electrónico</label>
          <input class="input" id="login-email" name="email" type="email" inputmode="email" autocomplete="username" autocapitalize="none" spellcheck="false" required aria-describedby="login-email-err">
          <p class="field__error" id="login-email-err" hidden></p>
        </div>
        <div class="field">
          <label class="field__label" for="login-password">Contraseña</label>
          <div class="input-group input-group--btn">
            <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required aria-describedby="login-password-err">
            <button class="input-group__btn" id="login-toggle" type="button" aria-pressed="false" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <p class="field__error" id="login-password-err" hidden></p>
        </div>
        <div class="field field--check">
          <label class="check" for="login-remember">
            <input class="check__input" id="login-remember" name="remember" type="checkbox">
            <span class="check__box" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span class="check__label">Recordarme en este equipo <span class="check__desc">Mantiene la sesión abierta 30 días. No lo uses en equipos compartidos.</span></span>
          </label>
        </div>
        <button class="btn btn--primary btn--lg btn--block" id="login-submit" type="submit"><span class="btn__label">Ingresar</span></button>
      </form>

      <p class="login__help">¿Olvidaste tu contraseña? Pídele a un administrador que te asigne una nueva desde <em>Usuarios</em>.</p>
    </div>
    <a class="login__back" href="../">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      Volver a la tienda
    </a>
  </main>
</body>
</html>
