# Mercy Studio — sitio estático servido por nginx en el puerto 4000
server {
    listen 4000;
    listen [::]:4000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # El navegador SIEMPRE revalida con el servidor (ETag): si el archivo no cambió responde 304 (casi gratis);
    # si hubo despliegue nuevo, trae la versión nueva al instante. Así nunca queda código viejo en caché.
    location ~* \.(html|css|js|json|txt|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "no-cache";
        etag on;
        try_files $uri =404;
    }
    # Solo las fuentes (no cambian) se guardan por una semana
    location ~* \.woff2?$ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
